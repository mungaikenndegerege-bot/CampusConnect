services:
  - type: web
    name: campusconnect
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # seed.py runs first to create tables and seed super admin, then gunicorn starts
    startCommand: python seed.py && gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 'app:create_app()'
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SUPER_ADMIN_NAME
        value: Adminmungai
      - key: SUPER_ADMIN_EMAIL
        value: admin@campusconnect.app
      - key: SUPER_ADMIN_PASSWORD
        # WARNING: Change this password after first login!
        # Set via Render Dashboard > Environment > SUPER_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        value: sqlite:///campusconnect.db
