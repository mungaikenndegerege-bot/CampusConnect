services:
  - type: web
    name: campusconnect
    env: python
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
