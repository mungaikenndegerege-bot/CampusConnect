<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CampusConnect</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#6C3CE1">
  <style>
    .account-bar-btn { background: none; border: 1px solid #6C3CE1; color: #6C3CE1; border-radius: 14px; padding: 3px 10px; font-size: 0.78rem; cursor: pointer; white-space: nowrap; }
    .account-bar-btn:hover { background: #6C3CE1; color: #fff; }
    #top-bar { display: flex; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>
  <div id="app-shell">
    <header id="top-bar">
      <div class="logo-area">
        <h1>CampusConnect</h1>
        <p class="tagline">Kila Kitu Made Easy</p>
      </div>
      <div id="account-bar" style="display:flex;align-items:center;gap:6px;padding:4px 8px"></div>
    </header>
    <!-- AdSense slot: replace this comment with your AdSense script tag -->
    <div id="adsense-slot" style="text-align:center;background:#fffbe6;border-top:2px solid #F5A623;border-bottom:2px solid #F5A623;padding:10px 16px;font-size:12px;color:#555;line-height:1.8;">
      <strong style="color:#F5A623;font-size:13px;">📣 Advertise Here</strong><br>
      Reach thousands of students across Kenya.<br>
      Contact: <a href="tel:0723432205" style="color:#6C3CE1;font-weight:700;text-decoration:none;">0723 432 205</a>
      &nbsp;·&nbsp;
      <a href="https://wa.me/254723432205" style="color:#25D366;font-weight:700;text-decoration:none;">WhatsApp Us</a>
    </div>
    <main id="main-content"><div class="spinner"></div></main>
    <nav id="bottom-nav">
      <button data-section="feed"><span class="nav-icon">&#127968;</span><span>Feed</span></button>
      <button data-section="community"><span class="nav-icon">&#128172;</span><span>Community</span></button>
      <button data-section="marketplace"><span class="nav-icon">&#128722;</span><span>Market</span></button>
      <button data-section="lostandfound"><span class="nav-icon">&#128269;</span><span>Lost &amp; Found</span></button>
      <button data-section="announcements"><span class="nav-icon">&#128226;</span><span>News</span></button>
    </nav>
    <div id="fab-container">
      <button id="fab-btn" style="display:none">+ Post</button>
    </div>
    <div id="modal-overlay">
      <div id="modal-box">
        <button id="modal-close">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>
    <div id="toast-container"></div>
  </div>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/feed.js"></script>
  <script src="/static/js/community.js"></script>
  <script src="/static/js/marketplace.js"></script>
  <script src="/static/js/lostandfound.js"></script>
  <script src="/static/js/announcements.js"></script>
  <script src="/static/js/account.js"></script>
<footer id="app-footer">
  <p>&copy; 2026 CampusConnect &nbsp;&middot;&nbsp; Kila Kitu Made Easy</p>
  <p>Developed by <strong>Ken Mungai</strong></p>
</footer>
</body>
</html>
